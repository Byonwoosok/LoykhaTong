<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทง</title>
<style>
:root{--gold:#ffd77a;--ink:#fff6dd}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#050818;font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif}
.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#050818 0%,#0d1440 38%,#2a1d5c 58%,#5a2f6b 62%)}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.moon{position:absolute;left:14%;top:9%;width:min(110px,18vw);aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 35% 35%,#fffdf0,#f7e7b0 55%,#e2c984);box-shadow:0 0 40px 12px rgba(255,236,170,.45),0 0 140px 50px rgba(255,220,140,.2)}
.hills{position:absolute;left:0;right:0;top:56%;height:7%;background:#0a0b25;clip-path:polygon(0 70%,8% 40%,18% 60%,30% 25%,42% 55%,55% 35%,68% 60%,80% 30%,92% 55%,100% 40%,100% 100%,0 100%)}
.lantern{position:absolute;bottom:-60px;width:26px;height:34px;border-radius:40% 40% 30% 30%;background:radial-gradient(circle at 50% 70%,#fff2b0,#ff9d2e 60%,#c9541a);
 box-shadow:0 0 20px 6px rgba(255,160,50,.55);animation:up linear infinite;opacity:.9}
@keyframes up{to{transform:translate(40px,-110vh) scale(.5);opacity:0}}
.water{position:absolute;left:0;right:0;top:62%;bottom:0;overflow:hidden;
 background:linear-gradient(#3a2a63 0%,#16224f 30%,#08123a 100%)}
.water::before{content:"";position:absolute;inset:0;opacity:.5;
 background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(255,255,255,.08) 10px 11px,transparent 12px 22px);
 animation:wv 6s linear infinite;mask-image:linear-gradient(90deg,transparent,#000 20%,#000 80%,transparent)}
@keyframes wv{to{background-position:0 22px;transform:translateX(-14px)}}
.moonref{position:absolute;left:calc(14% + 20px);top:0;width:min(70px,12vw);height:100%;
 background:linear-gradient(rgba(255,230,160,.55),transparent 85%);filter:blur(10px);animation:sh 4s ease-in-out infinite alternate}
@keyframes sh{to{transform:scaleX(1.5);opacity:.6}}
#fc,#rc{position:absolute;left:0;pointer-events:none}
#fc{top:0}
#rc{opacity:.35;filter:blur(1.5px);animation:rip 3s ease-in-out infinite alternate}
@keyframes rip{to{transform:translateX(5px) scaleY(.97)}}
#k{position:absolute;left:0;top:0;transform-origin:50% 80%;will-change:transform;z-index:5;cursor:pointer}
#k svg{display:block;width:100%;overflow:visible;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
#glow{position:absolute;z-index:4;border-radius:50%;pointer-events:none;
 background:radial-gradient(closest-side,rgba(255,190,80,.7),rgba(255,140,40,.25) 55%,transparent);mix-blend-mode:screen;filter:blur(6px)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:fl .22s infinite alternate ease-in-out}
@keyframes fl{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.ring{position:absolute;border:1.5px solid rgba(255,230,170,.7);border-radius:50%;transform:translate(-50%,-50%) scale(.2);animation:rg 2.8s ease-out forwards;z-index:3;pointer-events:none}
@keyframes rg{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.o{position:absolute;left:0;top:0;z-index:4;pointer-events:none;animation:fi 1.6s}
.o svg{display:block;width:100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.o b{display:block;text-align:center;font-weight:400;font-size:13px;color:#ffeec2;margin-top:4px;text-shadow:0 0 6px #000,0 0 10px #000}
@keyframes fi{from{opacity:0}}
.ui{position:absolute;left:0;right:0;bottom:calc(5% + env(safe-area-inset-bottom,0px));text-align:center;z-index:9;color:var(--ink)}
h1{position:absolute;left:0;right:0;top:calc(4% + env(safe-area-inset-top,0px));text-align:center;z-index:9;color:var(--gold);
 font-size:clamp(28px,6vw,54px);letter-spacing:.06em;text-shadow:0 0 18px rgba(255,200,90,.7);font-weight:600;pointer-events:none}
h1 small{display:block;font-size:.34em;color:#ffeec2;opacity:.85;letter-spacing:.12em;margin-top:4px;font-weight:400}
#nm{font:inherit;font-size:15px;padding:8px 16px;margin-bottom:10px;border-radius:20px;border:1px solid #ffe9a8;background:rgba(10,10,40,.55);color:#fff6dd;text-align:center;width:min(240px,70vw)}
button{font:inherit;font-size:20px;padding:13px 38px;border-radius:40px;border:1px solid #ffe9a8;color:#4a2a05;font-weight:600;cursor:pointer;
 background:linear-gradient(#ffe49a,#f0a93c);box-shadow:0 0 26px rgba(255,190,80,.6),inset 0 2px 0 #fff3c8;transition:transform .15s}
button:hover{transform:scale(1.05)}
.hint{margin-top:10px;font-size:14px;opacity:.8}
</style>
</head>
<body>
<div class="scene" id="scene">
 <div class="stars" id="stars"></div>
 <div class="moon"></div>
 <div class="hills"></div>
 <div id="lanterns"></div>
 <canvas id="fc"></canvas>
 <div class="water" id="water"><div class="moonref"></div><canvas id="rc"></canvas></div>
 <div id="glow"></div>
 <div id="k"></div>
 <h1>วันลอยกระทง<small>ขอบคุณพระแม่คงคา · ขอขมาและอธิษฐาน</small></h1>
 <div class="ui"><input id="nm" maxlength="20" placeholder="ชื่อของคุณ (ไม่ใส่ก็ได้)"><br><button id="btn">🪷 ปล่อยกระทง</button><div class="hint" id="hint">กดที่กระทงหรือปุ่มเพื่อปล่อยลงสายน้ำ · แตะท้องฟ้าเพื่อจุดดอกไม้ไฟ</div><div class="hint" id="cnt"></div></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
// ---------- stars & lanterns ----------
const st=document.getElementById('stars');
for(let i=0;i<110;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*52+'%';
 s.style.animationDelay=Math.random()*3+'s';s.style.opacity=Math.random();st.appendChild(s);}
const ln=document.getElementById('lanterns');
for(let i=0;i<9;i++){const l=document.createElement('div');l.className='lantern';l.style.left=(8+Math.random()*84)+'%';
 l.style.animationDuration=(22+Math.random()*20)+'s';l.style.animationDelay=(-Math.random()*30)+'s';
 l.style.transform='scale('+(.6+Math.random()*.6)+')';ln.appendChild(l);}

// ---------- krathong SVG ----------
function petals(cx,cy,rx,ry,n,h,w,cols,lean,off=0){
  const arr=[];for(let i=0;i<n;i++){const a=off+i/n*Math.PI*2;arr.push({a,s:Math.sin(a),c:Math.cos(a)});}
  arr.sort((p,q)=>p.s-q.s);
  return arr.map((p,i)=>{
    const bx=cx+p.c*rx,by=cy+p.s*ry,tx=bx+p.c*lean,ty=by-h;
    const g=cols[i%cols.length];
    return `<path d="M${bx-w} ${by} Q${bx-w*1.3} ${by-h*.55} ${tx} ${ty} Q${bx+w*1.3} ${by-h*.55} ${bx+w} ${by} Z" fill="url(#${g})" stroke="rgba(0,0,0,.18)" stroke-width=".6"/>
    <path d="M${bx} ${by-2} Q${bx+p.c*lean*.4} ${by-h*.5} ${tx} ${ty+4}" stroke="rgba(255,255,255,.35)" fill="none" stroke-width=".8"/>`;
  }).join('');
}
function marigolds(cx,cy,rx,ry,n){
  let o='';const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2+.1;a.push(t)}
  a.sort((p,q)=>Math.sin(p)-Math.sin(q));
  a.forEach(t=>{const x=cx+Math.cos(t)*rx,y=cy+Math.sin(t)*ry;
    o+=`<g transform="translate(${x} ${y})"><circle r="7.5" fill="#ff9d1c"/><circle r="5.5" fill="#ffc43a"/><circle r="3.2" fill="#ff8a00"/><circle r="1.3" fill="#fff0a0"/></g>`;});
  return o;
}
function sparkles(n){let o='';for(let i=0;i<n;i++){const t=i/n*6.283;o+=`<circle cx="${160+Math.cos(t)*108}" cy="${178+Math.sin(t)*25}" r="1.6" fill="#fff6c0"/>`}return o}
const svg=`<svg viewBox="0 0 320 250" xmlns="http://www.w3.org/2000/svg">
<defs>
 <linearGradient id="trunk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3dd94"/><stop offset="1" stop-color="#a97a2c"/></linearGradient>
 <radialGradient id="top" cx=".5" cy=".4"><stop offset="0" stop-color="#fff2b8"/><stop offset=".7" stop-color="#e4c066"/><stop offset="1" stop-color="#b98a35"/></radialGradient>
 <linearGradient id="leaf1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1f6b2c"/><stop offset="1" stop-color="#7fd05a"/></linearGradient>
 <linearGradient id="leaf2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#2f8a3a"/><stop offset="1" stop-color="#b6ef7c"/></linearGradient>
 <linearGradient id="pk1" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f5a0c9"/><stop offset="1" stop-color="#fff0f7"/></linearGradient>
 <linearGradient id="pk2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#e0509a"/><stop offset=".7" stop-color="#f89ac6"/><stop offset="1" stop-color="#ffe3f0"/></linearGradient>
 <linearGradient id="pk3" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c2307f"/><stop offset="1" stop-color="#ff8fc0"/></linearGradient>
 <linearGradient id="wh" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffe9b6"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
 <linearGradient id="candle" x1="0" x2="1"><stop offset="0" stop-color="#e8c98a"/><stop offset=".45" stop-color="#fff3d2"/><stop offset="1" stop-color="#d8b06a"/></linearGradient>
 <radialGradient id="fg" cx=".5" cy=".75"><stop offset="0" stop-color="#fff9d0"/><stop offset=".4" stop-color="#ffc84a"/><stop offset="1" stop-color="#ff6a00"/></radialGradient>
</defs>
<!-- trunk side -->
<path d="M32 178 A128 32 0 0 0 288 178 L288 198 A128 32 0 0 1 32 198 Z" fill="url(#trunk)"/>
<ellipse cx="160" cy="178" rx="128" ry="32" fill="url(#top)" stroke="#8a5f1f" stroke-width="1.2"/>
<ellipse cx="160" cy="178" rx="112" ry="27" fill="none" stroke="rgba(120,80,20,.35)"/>
<ellipse cx="160" cy="178" rx="90" ry="21" fill="none" stroke="rgba(120,80,20,.25)"/>
<!-- banana leaf pleats -->
${petals(160,184,118,29,26,44,10,['leaf1','leaf2'],10)}
<!-- gold trim -->
<path d="M44 200 Q160 244 276 200" stroke="#ffd35a" stroke-width="2" fill="none" opacity=".8"/>
${petals(160,180,92,22,18,40,11,['pk1','pk2'],6,.17)}
${petals(160,176,66,16,14,38,10,['pk2','pk3','pk1'],4,.35)}
${petals(160,172,42,10,10,32,9,['wh','pk1'],3,.1)}
${marigolds(160,187,110,26,14)}
${sparkles(20)}
<!-- incense -->
<g stroke-linecap="round">
 <line x1="146" y1="150" x2="112" y2="70" stroke="#8a4b1f" stroke-width="2.4"/>
 <line x1="160" y1="148" x2="160" y2="52" stroke="#9a5522" stroke-width="2.4"/>
 <line x1="174" y1="150" x2="208" y2="70" stroke="#8a4b1f" stroke-width="2.4"/>
 <circle cx="112" cy="70" r="2.6" fill="#ff5a2a"/><circle cx="160" cy="52" r="2.6" fill="#ff5a2a"/><circle cx="208" cy="70" r="2.6" fill="#ff5a2a"/>
</g>
<!-- candle -->
<rect x="150" y="106" width="20" height="56" rx="3" fill="url(#candle)" stroke="#b58a45" stroke-width=".8"/>
<ellipse cx="160" cy="106" rx="10" ry="3" fill="#fff6dc"/>
<line x1="160" y1="105" x2="160" y2="97" stroke="#3a2a1a" stroke-width="1.5"/>
<g class="flame"><path d="M160 60 Q173 82 168 94 Q160 103 152 94 Q147 82 160 60Z" fill="url(#fg)"/><path d="M160 80 Q165 90 160 98 Q155 90 160 80Z" fill="#fffbe0"/></g>
</svg>`;
const K=document.getElementById('k');K.innerHTML=svg;
const glow=document.getElementById('glow');

// ---------- canvas fireworks + reflection ----------
const fc=document.getElementById('fc'),rc=document.getElementById('rc'),fx=fc.getContext('2d'),rx=rc.getContext('2d');
let W,H,WT;
function size(){W=innerWidth;H=innerHeight;WT=Math.round(H*.62);fc.width=W;fc.height=H;rc.width=W;rc.height=H-WT;
 K.style.width=Math.min(300,W*.62)+'px';}
addEventListener('resize',size);size();
const parts=[],rockets=[];
function launch(x,y){rockets.push({x:x??W*(.15+Math.random()*.7),y:WT,ty:y??H*(.08+Math.random()*.3),vy:-(5+Math.random()*2),h:Math.random()*360});}
function burst(x,y,h){
  const n=90+Math.random()*60|0,type=Math.random();
  for(let i=0;i<n;i++){
    const a=i/n*6.283,sp=type<.4?3.2:1.2+Math.random()*3.4;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:1,d:.008+Math.random()*.008,h:h+(Math.random()*40-20),r:1.4+Math.random()*1.2});
  }
  if(type>.75)for(let i=0;i<40;i++){const a=Math.random()*6.28,s=Math.random()*5;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.012,h:(h+180)%360,r:1.2});}
}
let last=0,nextAuto=0;
function loop(t){
  const dt=Math.min(2,(t-last)/16.7||1);last=t;
  if(t>nextAuto){launch();nextAuto=t+1400+Math.random()*1800;}
  fx.globalCompositeOperation='destination-out';fx.fillStyle='rgba(0,0,0,.2)';fx.fillRect(0,0,W,H);
  fx.globalCompositeOperation='lighter';
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.y+=r.vy*dt;r.vy+=.06*dt;
    fx.fillStyle=`hsl(${r.h},100%,80%)`;fx.beginPath();fx.arc(r.x,r.y,2,0,6.3);fx.fill();
    if(r.vy>-1||r.y<r.ty){burst(r.x,r.y,r.h);rockets.splice(i,1);}}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.985;p.vy=p.vy*.985+.04*dt;p.l-=p.d*dt;
    if(p.l<=0||p.y>WT){parts.splice(i,1);continue;}
    fx.fillStyle=`hsla(${p.h},100%,${55+p.l*25}%,${p.l})`;fx.beginPath();fx.arc(p.x,p.y,p.r*p.l+.4,0,6.3);fx.fill();}
  // reflection
  rx.clearRect(0,0,rc.width,rc.height);rx.save();rx.scale(1,-1);
  const hh=rc.height,sy=Math.max(0,WT-hh);rx.drawImage(fc,0,sy,W,WT-sy,0,-hh,W,hh);rx.restore();
  krathong(t);
  requestAnimationFrame(loop);
}

// ---------- krathong state ----------
let released=false,t0=0,rippleT=0;
function ring(x,y,w){const r=document.createElement('div');r.className='ring';r.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${w*.28}px`;
 document.getElementById('scene').appendChild(r);setTimeout(()=>r.remove(),2900);}
function krathong(t){placeOthers(t);
  const kw=K.offsetWidth,kh=kw*250/320;
  let x=W/2,y,sc=1,rot=0;
  const hold=H*.5,drop=WT+(H-WT)*.42;
  const bob=Math.sin(t/700);
  if(!released){y=hold+bob*7;rot=Math.sin(t/1100)*1.5;}
  else{
    const e=(t-t0)/1000;
    if(e<1.1){const p=e/1.1;y=hold+(drop-hold)*p*p;x=W/2;rot=Math.sin(e*6)*3;}
    else{
      if(!rippleT){rippleT=1;ring(x,drop+kh*.3,kw*1.1);setTimeout(()=>ring(x,drop+kh*.3,kw*1.6),250);burst2();}
      const q=1-Math.exp(-(e-1.1)/28);
      x=W/2+(W*.22)*q;y=drop-(drop-(WT+(H-WT)*.2))*q;sc=1-.48*q;
      y+=bob*3;rot=Math.sin(t/900)*2.5+Math.sin(t/430)*1;
      if(Math.random()<.01)ring(x,y+kh*sc*.3,kw*sc*1.3);
    }
  }
  K.style.transform=`translate(${x-kw/2}px,${y-kh*.8}px) rotate(${rot}deg) scale(${sc})`;
  const gw=kw*sc*2.2;glow.style.cssText=`width:${gw}px;height:${gw*.7}px;left:${x-gw/2}px;top:${y-gw*.45}px;opacity:${.75+Math.sin(t/120)*.12}`;
}
function burst2(){for(let i=0;i<6;i++)setTimeout(()=>launch(W*(.2+i*.12),H*(.1+Math.random()*.25)),i*260);}
function release(){if(released)return;released=true;t0=performance.now();saveMine();
 document.getElementById('btn').textContent='🌙 ขอให้สมหวัง';document.getElementById('hint').textContent='ขอให้ทุกความทุกข์ลอยไปกับสายน้ำ';
 document.getElementById('btn').onclick=reset;}
function reset(){released=false;rippleT=0;delMine();document.getElementById('btn').textContent='🪷 ปล่อยกระทง';
 document.getElementById('hint').textContent='กดที่กระทงหรือปุ่มเพื่อปล่อยลงสายน้ำ · แตะท้องฟ้าเพื่อจุดดอกไม้ไฟ';document.getElementById('btn').onclick=release;}
document.getElementById('btn').onclick=release;
K.addEventListener('click',release);
document.getElementById('scene').addEventListener('pointerdown',e=>{if(e.clientY<WT-10&&e.target!==K&&!K.contains(e.target))launch(e.clientX,e.clientY);});
// ---------- shared river (Firebase Realtime Database, no login) ----------
// >>> ใส่ค่า config ของคุณตรงนี้ (ดูวิธีใน README ด้านล่างของแชท) <<<
const FIREBASE_CONFIG={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR-PROJECT.firebaseapp.com",
  databaseURL:"https://YOUR-PROJECT-default-rtdb.firebaseio.com",
  projectId:"YOUR-PROJECT"
};
let rdb=null,me=null;
try{me=localStorage.getItem('krathong_id');}catch(e){}
if(!me){me='u'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);try{localStorage.setItem('krathong_id',me);}catch(e){}}
const others=new Map();let firstSnap=true;setTimeout(()=>firstSnap=false,2500);
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return(h>>>0)/4294967296}
const HUES=[0,25,-40,70,190,-80];
function setCount(){document.getElementById('cnt').textContent=others.size?`🪷 มีกระทงของคนอื่นลอยอยู่ ${others.size} ใบ`:'';}
function addOther(id,d){
 if(others.has(id))return;
 const el=document.createElement('div');el.className='o';el.innerHTML=svg;
 el.firstChild.style.filter=`hue-rotate(${HUES[Math.floor(hash(id+'h')*HUES.length)]}deg) drop-shadow(0 4px 6px rgba(0,0,0,.4))`;
 const lb=document.createElement('b');lb.textContent=String((d&&d.name)||'').slice(0,20);el.appendChild(lb);
 document.getElementById('scene').appendChild(el);
 const o={el,lb,fx:hash(id+'x'),fy:hash(id+'y'),ph:hash(id+'p')*6.28};others.set(id,o);
 if(!firstSnap)setTimeout(()=>{launch(W*(.2+o.fx*.6),H*.2);launch(W*(.3+o.fx*.4),H*.12)},300);
}
function placeOthers(t){
 const kw=Math.min(150,W*.3);
 others.forEach(o=>{
  const fy=.08+o.fy*.84,sc=.32+fy*.5;
  const x=W*(.08+o.fx*.84)+Math.sin(t/4000+o.ph)*16;
  const y=WT+(H-WT)*fy+Math.sin(t/800+o.ph)*3;
  o.el.style.width=kw+'px';
  o.el.style.transform=`translate(${x-kw/2}px,${y-kw*.4}px) rotate(${Math.sin(t/900+o.ph)*2.5}deg) scale(${sc})`;
 });
}
function saveMine(){try{if(rdb)rdb.ref('krathongs/'+me).set({t:Date.now(),name:document.getElementById('nm').value.trim().slice(0,20)});}catch(e){}}
function delMine(){try{if(rdb)rdb.ref('krathongs/'+me).remove();}catch(e){}}
(function init(){
 try{
  if(!window.firebase||FIREBASE_CONFIG.databaseURL.includes('YOUR-PROJECT'))return;
  firebase.initializeApp(FIREBASE_CONFIG);rdb=firebase.database();
  const q=rdb.ref('krathongs').orderByChild('t').limitToLast(40);
  q.on('child_added',s=>{
   const id=s.key,d=s.val()||{};
   if(id===me){if(!released){released=true;rippleT=1;t0=performance.now()-60000;
     document.getElementById('btn').textContent='🌙 ขอให้สมหวัง';document.getElementById('btn').onclick=reset;}return;}
   addOther(id,d);setCount();
  });
  q.on('child_removed',s=>{const o=others.get(s.key);if(o){o.el.remove();others.delete(s.key);setCount();}});
 }catch(e){console.warn(e)}
})();
requestAnimationFrame(loop);
</script>
</body>
</html>
